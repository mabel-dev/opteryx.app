name: Feature request
description: Suggest an improvement to the opteryx.app platform
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the situation you're in, not only the solution you have in mind.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to see?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What have you tried or considered instead?
  - type: textarea
    id: context
    attributes:
      label: Anything else?
      description: Examples, links, or screenshots that help explain it.
