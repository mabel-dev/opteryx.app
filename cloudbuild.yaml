substitutions:
  _SERVICE: "all"
  # Comma-separated list of regions to deploy to. Use GCP region names (e.g. us-east1,us-west1)
  _REGIONS: "us-east1,us-west1"
  # If true, attempt to map custom domains after deploy. Requires domain ownership and proper DNS.
  _MAP_DOMAINS: "false"
  # Custom domains to map (optional)
  _AUTH_DOMAIN: "auth.opteryx.app"
  _DATA_DOMAIN: "data.opteryx.app"
  _WEB_DOMAIN: "opteryx.app"
  _WORKER_DOMAIN: "worker.opteryx.app"

steps:
  # Build `data` image when _SERVICE is 'data' or 'all'
  - id: BuildData
    name: 'gcr.io/kaniko-project/executor:latest'
    args:
      - --dockerfile=data/Dockerfile
      - --context=dir:///workspace
      - --destination=us-east1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/opteryx-data:$SHORT_SHA
      - --destination=us-east1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/opteryx-data:latest
      - --cache=true

  # Build `auth` image when _SERVICE is 'auth' or 'all'
  - id: BuildAuth
    name: 'gcr.io/kaniko-project/executor:latest'
    args:
      - --dockerfile=auth/Dockerfile
      - --context=dir:///workspace
      - --destination=us-east1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/opteryx-auth:$SHORT_SHA
      - --destination=us-east1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/opteryx-auth:latest
      - --cache=true
  # Build `web` static image when _SERVICE is 'web' or 'all'
  - id: BuildWeb
    name: 'gcr.io/kaniko-project/executor:latest'
    args:
      - --dockerfile=web/Dockerfile
      - --context=dir:///workspace
      - --destination=us-east1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/opteryx-web:$SHORT_SHA
      - --destination=us-east1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/opteryx-web:latest
      - --cache=true

  # Build `worker` image when _SERVICE is 'worker' or 'all'
  - id: BuildWorker
    name: 'gcr.io/kaniko-project/executor:latest'
    args:
      - --dockerfile=worker/Dockerfile
      - --context=dir:///workspace
      - --destination=us-east1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/opteryx-worker:$SHORT_SHA
      - --destination=us-east1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/opteryx-worker:latest
      - --cache=true
  # Deploy steps: use gcloud to deploy the built images to Cloud Run in the specified regions.
  # This step uses substitutions: `_REGIONS` (comma-separated), `_MAP_DOMAINS` (true/false),
  # `_AUTH_DOMAIN`, `_DATA_DOMAIN`.
  - id: DeployAndMap
    name: 'gcr.io/cloud-builders/gcloud'
    entrypoint: 'bash'
    args:
      - -c
      - |
        set -euo pipefail
        echo "Deploy substitution values: SERVICE=${_SERVICE} REGIONS=${_REGIONS} MAP_DOMAINS=${_MAP_DOMAINS}"
        IFS=',' read -r -a REG_ARR <<< "${_REGIONS}"

        deploy_image() {
          local svc_name="$1"
          local image="$2"
          for region in "${REG_ARR[@]}"; do
            echo "Deploying ${svc_name} to ${region}"
            gcloud run deploy "${svc_name}" \
              --image="${image}" \
              --region="${region}" \
              --platform=managed \
              --allow-unauthenticated \
              --project="${PROJECT_ID}"

            if [ "${_MAP_DOMAINS}" = "true" ]; then
              if [ "${svc_name}" = "opteryx-auth" ] && [ -n "${_AUTH_DOMAIN}" ]; then
                echo "Mapping domain ${_AUTH_DOMAIN} to ${svc_name} in ${region}"
                gcloud run domain-mappings create --service="${svc_name}" --domain="${_AUTH_DOMAIN}" --region="${region}" --platform=managed --project="${PROJECT_ID}" || echo "domain mapping failed for ${_AUTH_DOMAIN} in ${region}"
              fi
              if [ "${svc_name}" = "opteryx-data" ] && [ -n "${_DATA_DOMAIN}" ]; then
                echo "Mapping domain ${_DATA_DOMAIN} to ${svc_name} in ${region}"
                gcloud run domain-mappings create --service="${svc_name}" --domain="${_DATA_DOMAIN}" --region="${region}" --platform=managed --project="${PROJECT_ID}" || echo "domain mapping failed for ${_DATA_DOMAIN} in ${region}"
              fi
            fi
          done
        }

        # Decide which services to deploy
        if [ "${_SERVICE}" = "all" ] || [ "${_SERVICE}" = "data" ]; then
          deploy_image "opteryx-data" "gcr.io/${PROJECT_ID}/opteryx-data:${SHORT_SHA}"
        else
          echo "Skipping opteryx-data deploy"
        fi

        if [ "${_SERVICE}" = "all" ] || [ "${_SERVICE}" = "auth" ]; then
          deploy_image "opteryx-auth" "gcr.io/${PROJECT_ID}/opteryx-auth:${SHORT_SHA}"
        else
          echo "Skipping opteryx-auth deploy"
        fi

        if [ "${_SERVICE}" = "all" ] || [ "${_SERVICE}" = "web" ]; then
          deploy_image "opteryx-web" "gcr.io/${PROJECT_ID}/opteryx-web:${SHORT_SHA}"
        else
          echo "Skipping opteryx-web deploy"
        fi

        # Deploy worker without allowing unauthenticated invocations (protected)
        if [ "${_SERVICE}" = "all" ] || [ "${_SERVICE}" = "worker" ]; then
          for region in "${REG_ARR[@]}"; do
            echo "Deploying opteryx-worker to ${region} (no anonymous access)"
            gcloud run deploy "opteryx-worker" \
              --image="gcr.io/${PROJECT_ID}/opteryx-worker:${SHORT_SHA}" \
              --region="${region}" \
              --platform=managed \
              --no-allow-unauthenticated \
              --project="${PROJECT_ID}"

            if [ "${_MAP_DOMAINS}" = "true" ] && [ -n "${_WORKER_DOMAIN}" ]; then
              echo "Mapping domain ${_WORKER_DOMAIN} to opteryx-worker in ${region}"
              gcloud run domain-mappings create --service="opteryx-worker" --domain="${_WORKER_DOMAIN}" --region="${region}" --platform=managed --project="${PROJECT_ID}" || echo "domain mapping failed for ${_WORKER_DOMAIN} in ${region}"
            fi
          done
        else
          echo "Skipping opteryx-worker deploy"
        fi

    waitFor: [BuildData, BuildAuth, BuildWeb, BuildWorker]

images:
  - us-east1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/opteryx-data:$SHORT_SHA
  - us-east1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/opteryx-auth:$SHORT_SHA
  - us-east1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/opteryx-web:$SHORT_SHA
  - us-east1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/opteryx-worker:$SHORT_SHA

options:
  machineType: "E2_HIGHCPU_8"

timeout: "1200s"
